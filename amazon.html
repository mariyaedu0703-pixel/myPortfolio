<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/bootstrap.css" href="/style.css">
    <meta charset="UTF-8">
    <title>Fluid Grid Layout</title>
    <style>
        body {
            padding: 20px;
        }
        .row {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
        .column {
            width: 33.33%;
            height: auto;       
            background:pink;
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid white;
            text-align: center;
        }
        @media (max-width: 600px) {
            .column {
                width: auto;     
            }
        }
    </style>
</head>
<body>
<h2>Fluid Grid</h2>
<div class="row">
    <div class="column">BOX 1</div>
    <div class="column">BOX 2</div>
    <div class="column">BOX 3</div>
    <div class="column">BOX 4</div>
    <div class="column">BOX 5</div>
    <div class="column">BOX 6</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
 <srcipt src="/js/bootstrap.js"></srcipt>  
</body>
</html>
